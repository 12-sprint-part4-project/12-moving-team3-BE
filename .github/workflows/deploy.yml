name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/server
            git fetch origin
            git checkout main
            git reset --hard origin/main
            pm2 stop be || true
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            NODE_OPTIONS="--max-old-space-size=1536" npm run build
            npm prune --omit=dev
            pm2 restart be
