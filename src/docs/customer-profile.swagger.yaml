components:
  schemas:
    CustomerProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [region, service, profileImageUrl, updatedAt]
          properties:
            region:
              type: string
              enum:
                - SEOUL
                - GYEONGGI
                - INCHEON
                - GANGWON
                - CHUNGBUK
                - CHUNGNAM
                - SEJONG
                - DAEJEON
                - JEONBUK
                - GWANGJU_JEONNAM
                - GYEONGBUK
                - DAEGU
                - ULSAN
                - GYEONGNAM
                - BUSAN
                - JEJU
              example: SEOUL
            service:
              type: array
              items:
                type: string
                enum: [SMALL, HOME, OFFICE]
              example: [HOME, SMALL]
            profileImageUrl:
              type: string
              nullable: true
              description: 공개 프로필 이미지 URL. CDN/S3 공개 base URL이 없으면 null
              example: null
            updatedAt:
              type: string
              format: date-time
              example: '2026-07-28T08:20:00.000Z'

    CustomerProfileMeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - profileId
            - userId
            - name
            - email
            - phoneNumber
            - profileImageUrl
            - service
            - region
            - createdAt
            - updatedAt
          properties:
            profileId:
              type: integer
              example: 15
            userId:
              type: string
              format: uuid
              example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
            name:
              type: string
              example: 박소정
            email:
              type: string
              format: email
              example: sojeong@example.com
            phoneNumber:
              type: string
              nullable: true
              example: '01012345678'
            profileImageUrl:
              type: string
              nullable: true
              description: 공개 프로필 이미지 URL. CDN/S3 공개 base URL이 없으면 null
              example: null
            service:
              type: array
              items:
                type: string
                enum: [SMALL, HOME, OFFICE]
              example: [HOME, SMALL]
            region:
              type: string
              nullable: true
              enum:
                - SEOUL
                - GYEONGGI
                - INCHEON
                - GANGWON
                - CHUNGBUK
                - CHUNGNAM
                - SEJONG
                - DAEJEON
                - JEONBUK
                - GWANGJU_JEONNAM
                - GYEONGBUK
                - DAEGU
                - ULSAN
                - GYEONGNAM
                - BUSAN
                - JEJU
              example: SEOUL
            createdAt:
              type: string
              format: date-time
              example: '2026-07-20T13:30:00.000Z'
            updatedAt:
              type: string
              format: date-time
              example: '2026-07-21T10:00:00.000Z'

paths:
  /api/users/customers/profile:
    get:
      tags: [Customers]
      summary: 일반 유저 본인 프로필 조회
      description: |
        로그인한 일반 유저(CUSTOMER)의 등록된 프로필을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileMeResponse'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 일반 유저(CUSTOMER)만 접근 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 등록된 프로필 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Customers]
      summary: 일반 유저 프로필 등록/수정
      description: |
        일반 유저(CUSTOMER)가 프로필 정보를 등록하거나 수정합니다.
        - Content-Type: `multipart/form-data`
        - `profileImage`는 선택값입니다.
        - `profileImage`를 보내지 않으면 프로필 이미지는 null로 저장됩니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - region
                - service
              properties:
                region:
                  type: string
                  description: 거주 지역
                  enum:
                    - SEOUL
                    - GYEONGGI
                    - INCHEON
                    - GANGWON
                    - CHUNGBUK
                    - CHUNGNAM
                    - SEJONG
                    - DAEJEON
                    - JEONBUK
                    - GWANGJU_JEONNAM
                    - GYEONGBUK
                    - DAEGU
                    - ULSAN
                    - GYEONGNAM
                    - BUSAN
                    - JEJU
                  example: SEOUL
                service:
                  type: array
                  description: 이용 서비스 목록 (최소 1개)
                  minItems: 1
                  items:
                    type: string
                    enum: [SMALL, HOME, OFFICE]
                  example: [HOME, SMALL]
                profileImage:
                  type: string
                  format: binary
                  description: 프로필 이미지 파일 (jpeg/png/webp, 최대 5MB)
            examples:
              default:
                summary: 일반 유저 프로필 등록 예시
                value:
                  region: SEOUL
                  service: [HOME, SMALL]
      responses:
        '200':
          description: 프로필 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '400':
          description: 요청 본문 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 일반 유저(CUSTOMER)만 접근 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 등록 대상 프로필 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 프로필 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
