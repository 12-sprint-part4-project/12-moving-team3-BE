components:
  schemas:
    CustomerProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [region, service, profileImageUrl, updatedAt]
          properties:
            region:
              type: string
              enum:
                - SEOUL
                - GYEONGGI
                - INCHEON
                - GANGWON
                - CHUNGBUK
                - CHUNGNAM
                - SEJONG
                - DAEJEON
                - JEONBUK
                - GWANGJU_JEONNAM
                - GYEONGBUK
                - DAEGU
                - ULSAN
                - GYEONGNAM
                - BUSAN
                - JEJU
              example: SEOUL
            service:
              type: array
              items:
                type: string
                enum: [SMALL, HOME, OFFICE]
              example: [HOME, SMALL]
            profileImageUrl:
              type: string
              nullable: true
              description: 조회용 Presigned GET URL (유효 시간 1시간). 이미지 없으면 null
              example: null
            updatedAt:
              type: string
              format: date-time
              example: '2026-07-28T08:20:00.000Z'

    CustomerProfileMeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - profileId
            - userId
            - name
            - email
            - phoneNumber
            - profileImageUrl
            - service
            - region
            - createdAt
            - updatedAt
          properties:
            profileId:
              type: integer
              example: 15
            userId:
              type: string
              format: uuid
              example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
            name:
              type: string
              example: 박소정
            email:
              type: string
              format: email
              example: sojeong@example.com
            phoneNumber:
              type: string
              nullable: true
              example: '01012345678'
            profileImageUrl:
              type: string
              nullable: true
              description: 조회용 Presigned GET URL (유효 시간 1시간). 이미지 없으면 null
              example: null
            service:
              type: array
              items:
                type: string
                enum: [SMALL, HOME, OFFICE]
              example: [HOME, SMALL]
            region:
              type: string
              nullable: true
              enum:
                - SEOUL
                - GYEONGGI
                - INCHEON
                - GANGWON
                - CHUNGBUK
                - CHUNGNAM
                - SEJONG
                - DAEJEON
                - JEONBUK
                - GWANGJU_JEONNAM
                - GYEONGBUK
                - DAEGU
                - ULSAN
                - GYEONGNAM
                - BUSAN
                - JEJU
              example: SEOUL
            createdAt:
              type: string
              format: date-time
              example: '2026-07-20T13:30:00.000Z'
            updatedAt:
              type: string
              format: date-time
              example: '2026-07-21T10:00:00.000Z'

paths:
  /api/users/customers/profile:
    get:
      tags: [Customers]
      summary: 일반 유저 본인 프로필 조회
      description: |
        로그인한 일반 유저(CUSTOMER)의 등록된 프로필을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileMeResponse'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 일반 유저(CUSTOMER)만 접근 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 등록된 프로필 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Customers]
      summary: 일반 유저 프로필 등록/수정
      description: |
        일반 유저(CUSTOMER)가 프로필 정보를 등록하거나 수정합니다.
        - Content-Type: `application/json`
        - `s3Key`는 선택값입니다. Presigned URL로 S3 업로드 후 받은 key를 전달합니다.
        - `s3Key`를 보내지 않으면 프로필 이미지는 null로 저장됩니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - region
                - service
              properties:
                region:
                  type: string
                  description: 거주 지역
                  enum:
                    - SEOUL
                    - GYEONGGI
                    - INCHEON
                    - GANGWON
                    - CHUNGBUK
                    - CHUNGNAM
                    - SEJONG
                    - DAEJEON
                    - JEONBUK
                    - GWANGJU_JEONNAM
                    - GYEONGBUK
                    - DAEGU
                    - ULSAN
                    - GYEONGNAM
                    - BUSAN
                    - JEJU
                  example: SEOUL
                service:
                  type: array
                  description: 이용 서비스 목록 (최소 1개)
                  minItems: 1
                  items:
                    type: string
                    enum: [SMALL, HOME, OFFICE]
                  example: [HOME, SMALL]
                s3Key:
                  type: string
                  description: Presigned 업로드 후 받은 S3 key
                  example: uploads/1710000000000_profile.jpg
            examples:
              default:
                summary: 일반 유저 프로필 등록 예시
                value:
                  region: SEOUL
                  service: [HOME, SMALL]
                  s3Key: uploads/1710000000000_profile.jpg
      responses:
        '200':
          description: 프로필 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '400':
          description: 요청 본문 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 일반 유저(CUSTOMER)만 접근 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 등록 대상 프로필 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 프로필 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/customers/profile/presigned-upload-url:
    get:
      tags: [Customers]
      summary: 프로필 이미지 업로드용 Presigned URL 발급
      description: |
        S3에 직접 업로드할 수 있는 Presigned PUT URL을 발급합니다. (유효 시간 5분)
        쿼리: `filename`, `contentType`
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: filename
          required: true
          schema:
            type: string
          example: profile.jpg
        - in: query
          name: contentType
          required: true
          schema:
            type: string
          example: image/jpeg
      responses:
        '200':
          description: Presigned URL 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uploadUrl:
                        type: string
                        description: S3 PUT 업로드 URL
                      s3Key:
                        type: string
                        description: 프로필 등록 시 body.s3Key로 전달할 값
        '400':
          description: 쿼리 파라미터 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 일반 유저(CUSTOMER)만 접근 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
