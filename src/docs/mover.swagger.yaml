components:
  schemas:
    EstimateRequestListItem:
      type: object
      properties:
        id:
          type: integer
          example: 101
        customer:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: 홍길동
        moveType:
          type: string
          enum: [SMALL, HOME, OFFICE]
          nullable: true
        moveDate:
          type: string
          format: date
          nullable: true
        departure:
          type: object
          properties:
            address:
              type: string
              nullable: true
              example: 서울특별시 강남구 테헤란로 123
            regionLabel:
              type: string
              nullable: true
              example: 서울
        arrival:
          type: object
          properties:
            address:
              type: string
              nullable: true
              example: 경기도 성남시 분당구 판교역로 456
            regionLabel:
              type: string
              nullable: true
              example: 경기
        isDesignated:
          type: boolean
        createdAt:
          type: string
          format: date-time
    EstimateRequestListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EstimateRequestListItem'
        meta:
          type: object
          properties:
            totalCount:
              type: integer
              example: 42
            nextCursor:
              type: string
              nullable: true
              description: 다음 페이지 조회에 사용할 커서. 없으면 마지막 페이지.
            hasNextPage:
              type: boolean
            filterCounts:
              type: object
              description: 현재 커서와 무관하게 집계한, 뱃지 표시용 카운트
              properties:
                moveType:
                  type: object
                  properties:
                    SMALL:
                      type: integer
                    HOME:
                      type: integer
                    OFFICE:
                      type: integer
                serviceAreaOnly:
                  type: integer
                designated:
                  type: integer
    QuoteProposalRequest:
      type: object
      required: [type, price, comment]
      properties:
        type:
          type: string
          enum: [PROPOSAL]
          description: 견적 보내기
        price:
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 150000
          description: 견적 금액 (최대 10억)
        comment:
          type: string
          minLength: 10
          maxLength: 500
          example: 안전하고 신속하게 이사 도와드리겠습니다.
          description: 견적 코멘트 (10~500자)
    QuoteRejectionRequest:
      type: object
      required: [type, rejectReason]
      properties:
        type:
          type: string
          enum: [REJECTION]
          description: 반려하기
        rejectReason:
          type: string
          minLength: 10
          maxLength: 500
          example: 해당 일정에 이미 다른 이사가 예약되어 있습니다.
          description: 반려 사유 (10~500자)
    QuoteSubmitRequest:
      oneOf:
        - $ref: '#/components/schemas/QuoteProposalRequest'
        - $ref: '#/components/schemas/QuoteRejectionRequest'
      discriminator:
        propertyName: type
        mapping:
          PROPOSAL: '#/components/schemas/QuoteProposalRequest'
          REJECTION: '#/components/schemas/QuoteRejectionRequest'
    QuoteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            estimateRequestId:
              type: integer
              example: 101
            moverId:
              type: string
              format: uuid
            price:
              type: integer
              nullable: true
              example: 150000
            comment:
              type: string
              nullable: true
              example: 안전하고 신속하게 이사 도와드리겠습니다.
            rejectReason:
              type: string
              nullable: true
            status:
              type: string
              enum: [PENDING, CONFIRMED, REJECTED]
            isDesignated:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true

paths:
  /api/users/movers/estimate-requests:
    get:
      tags: [Movers]
      summary: 기사님이 받은 견적 요청 목록 조회
      description: |
        기사(Mover)에게 들어온 견적 요청 목록을 커서 기반으로 조회합니다.
        이미 견적을 제출/반려했거나 이사일이 지난 요청은 기본적으로 제외됩니다.
        Access Token이 필요하며, userType이 MOVER인 계정만 접근할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: 고객 이름 부분 일치 검색
          schema:
            type: string
        - name: moveType
          in: query
          required: false
          description: 이사 유형 필터 (다중 선택 가능, 콤마 구분 또는 반복 파라미터)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [SMALL, HOME, OFFICE]
        - name: designated
          in: query
          required: false
          description: true 인 경우 기사님에게 직접 지정된 견적 요청만 조회
          schema:
            type: boolean
        - name: serviceArea
          in: query
          required: false
          description: true 인 경우 기사님의 서비스 가능 지역과 매칭되는 요청만 조회
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: 정렬 조건 (기본값 MOVE_DATE_ASC)
          schema:
            type: string
            enum: [MOVE_DATE_ASC, CREATED_AT_ASC]
            default: MOVE_DATE_ASC
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 meta.nextCursor 값 (무한 스크롤 다음 페이지 조회 시 사용)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지당 조회 개수 (기본값 10, 최대 20)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: 견적 요청 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateRequestListResponse'
        '400':
          description: 유효하지 않은 정렬/필터 값
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 정렬 또는 필터 값입니다.
        '401':
          description: Access Token 누락 또는 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '403':
          description: MOVER가 아닌 계정으로 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_TYPE_FORBIDDEN
                  message: 접근 권한이 없습니다.
        '404':
          description: 등록된 기사님 프로필이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: PROFILE_NOT_REGISTERED
                  message: 등록된 기사님 프로필이 없습니다. 프로필을 먼저 등록해 주세요.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/users/movers/estimate-requests/{estimateRequestId}/quotes:
    post:
      tags: [Movers]
      summary: 견적 보내기 / 반려하기
      description: |
        단일 엔드포인트에서 Request Body의 'type' 필드에 따라 기능을 분기합니다.
        - 'PROPOSAL': 견적 보내기 (price, comment 필수)
        - 'REJECTION': 반려하기 (rejectReason 필수)

        동시성 제어:
        - 지정견적 요청은 최대 3개, 일반 견적 요청은 최대 5개까지 PROPOSAL 접수
        - 'SELECT ... FOR UPDATE' 비관적 락으로 Race Condition 방어
        - '(estimateRequestId, moverId)' 유니크 제약으로 중복 제출(따닥) 방어
        - 반려(REJECTION)는 마감 인원 카운트에서 제외

        인증/인가 미들웨어 연결 전이라 Controller에서 임시 moverId를 사용합니다.
      # TODO: 인증/인가 미들웨어 구현 후 주석 해제
      # security:
      #   - bearerAuth: []
      parameters:
        - name: estimateRequestId
          in: path
          required: true
          description: 견적 요청 ID
          schema:
            type: integer
            minimum: 1
            example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteSubmitRequest'
            examples:
              proposal:
                summary: 견적 보내기
                value:
                  type: PROPOSAL
                  price: 150000
                  comment: 안전하고 신속하게 이사 도와드리겠습니다.
              rejection:
                summary: 반려하기
                value:
                  type: REJECTION
                  rejectReason: 해당 일정에 이미 다른 이사가 예약되어 있습니다.
      responses:
        '201':
          description: 견적 제출 또는 반려 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
              examples:
                proposal:
                  summary: 견적 보내기 성공
                  value:
                    data:
                      id: 1
                      estimateRequestId: 101
                      moverId: dummy-mover-uuid
                      price: 150000
                      comment: 안전하고 신속하게 이사 도와드리겠습니다.
                      rejectReason: null
                      status: PENDING
                      isDesignated: false
                      createdAt: '2026-07-27T08:00:00.000Z'
                      updatedAt: '2026-07-27T08:00:00.000Z'
                      deletedAt: null
                rejection:
                  summary: 반려하기 성공
                  value:
                    data:
                      id: 2
                      estimateRequestId: 101
                      moverId: dummy-mover-uuid
                      price: null
                      comment: null
                      rejectReason: 해당 일정에 이미 다른 이사가 예약되어 있습니다.
                      status: REJECTED
                      isDesignated: true
                      createdAt: '2026-07-27T08:00:00.000Z'
                      updatedAt: '2026-07-27T08:00:00.000Z'
                      deletedAt: null
        '400':
          description: 요청 Body / Path Parameter 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST_BODY
                  message: 요청 본문 형식이 올바르지 않습니다.
        '401':
          description: 인증 실패 (인증 미들웨어 적용 후)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '403':
          description: 지정 견적 대상이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_DESIGNATED_TARGET
                  message: 지정 견적 대상 기사님이 아닙니다.
        '404':
          description: 견적 요청을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REQUEST_NOT_FOUND
                  message: 견적 요청을 찾을 수 없습니다.
        '409':
          description: |
            비즈니스 충돌
            - REQUEST_EXPIRED: 이사일 경과
            - REQUEST_CLOSED: 견적 제출 인원 마감 (지정 3 / 일반 5)
            - QUOTE_ALREADY_SUBMITTED: 이미 견적 제출
            - ALREADY_REJECTED: 이미 반려
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired:
                  summary: 이사일 경과
                  value:
                    error:
                      code: REQUEST_EXPIRED
                      message: 이사일이 지나 견적 요청이 만료되었습니다.
                closed:
                  summary: 인원 마감
                  value:
                    error:
                      code: REQUEST_CLOSED
                      message: 견적 제출 가능 인원이 마감되었습니다.
                alreadySubmitted:
                  summary: 중복 견적 제출
                  value:
                    error:
                      code: QUOTE_ALREADY_SUBMITTED
                      message: 이미 견적을 제출한 요청입니다.
                alreadyRejected:
                  summary: 이미 반려
                  value:
                    error:
                      code: ALREADY_REJECTED
                      message: 이미 반려한 견적 요청입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
