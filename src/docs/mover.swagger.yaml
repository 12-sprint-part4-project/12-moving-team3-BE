components:
  schemas:
    EstimateRequestListItem:
      type: object
      properties:
        id:
          type: integer
          example: 101
        customer:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: 홍길동
        moveType:
          type: string
          enum: [SMALL, HOME, OFFICE]
          nullable: true
        moveDate:
          type: string
          format: date
          nullable: true
        departure:
          type: object
          properties:
            address:
              type: string
              nullable: true
              example: 서울특별시 강남구 테헤란로 123
            regionLabel:
              type: string
              nullable: true
              example: 서울
        arrival:
          type: object
          properties:
            address:
              type: string
              nullable: true
              example: 경기도 성남시 분당구 판교역로 456
            regionLabel:
              type: string
              nullable: true
              example: 경기
        isDesignated:
          type: boolean
        designatedMoverId:
          type: integer
          nullable: true
          description: EstimateDesignatedMover.id (지정 채팅방 생성용). 비지정이면 null
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: 견적 요청 제출 시각 (요청일)
        quoteCount:
          type: object
          description: 해당 요청에 도착한 대기 중(PENDING) 견적의 지정/일반 건수
          properties:
            designated:
              type: integer
              example: 1
            general:
              type: integer
              example: 4
    EstimateRequestListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EstimateRequestListItem'
        meta:
          type: object
          properties:
            totalCount:
              type: integer
              example: 42
            nextCursor:
              type: string
              nullable: true
              description: 다음 페이지 조회에 사용할 커서. 없으면 마지막 페이지.
            hasNextPage:
              type: boolean
            filterCounts:
              type: object
              description: 현재 커서와 무관하게 집계한, 뱃지 표시용 카운트
              properties:
                moveType:
                  type: object
                  properties:
                    SMALL:
                      type: integer
                    HOME:
                      type: integer
                    OFFICE:
                      type: integer
                serviceAreaOnly:
                  type: integer
                designated:
                  type: integer
    QuoteProposalRequest:
      type: object
      required: [type, price, comment]
      properties:
        type:
          type: string
          enum: [PROPOSAL]
          description: 견적 보내기
        price:
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 150000
          description: 견적 금액 (최대 10억)
        comment:
          type: string
          minLength: 10
          maxLength: 500
          example: 안전하고 신속하게 이사 도와드리겠습니다.
          description: 견적 코멘트 (10~500자)
    QuoteRejectionRequest:
      type: object
      required: [type, rejectReason]
      properties:
        type:
          type: string
          enum: [REJECTION]
          description: 반려하기
        rejectReason:
          type: string
          minLength: 10
          maxLength: 500
          example: 해당 일정에 이미 다른 이사가 예약되어 있습니다.
          description: 반려 사유 (10~500자)
    QuoteSubmitRequest:
      oneOf:
        - $ref: '#/components/schemas/QuoteProposalRequest'
        - $ref: '#/components/schemas/QuoteRejectionRequest'
      discriminator:
        propertyName: type
        mapping:
          PROPOSAL: '#/components/schemas/QuoteProposalRequest'
          REJECTION: '#/components/schemas/QuoteRejectionRequest'
    QuoteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            estimateRequestId:
              type: integer
              example: 101
            moverId:
              type: string
              format: uuid
            price:
              type: integer
              nullable: true
              example: 150000
            comment:
              type: string
              nullable: true
              example: 안전하고 신속하게 이사 도와드리겠습니다.
            rejectReason:
              type: string
              nullable: true
            status:
              type: string
              enum: [PENDING, CONFIRMED, REJECTED]
            isDesignated:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true
    QuoteDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            estimateRequestId:
              type: integer
              example: 101
            price:
              type: integer
              nullable: true
              example: 180000
            status:
              type: string
              enum: [PENDING, CONFIRMED, REJECTED]
              example: CONFIRMED
            comment:
              type: string
              nullable: true
              example: 안전하고 신속하게 이사 도와드리겠습니다.
              description: 견적 코멘트 (보낸 견적). 반려 견적이면 null
            rejectReason:
              type: string
              nullable: true
              example: null
            estimateRequestStatus:
              type: string
              enum: [DRAFT, SUBMITTED, CONFIRMED, COMPLETED, EXPIRED, CANCELED]
              description: 연결된 견적 요청 상태
              example: COMPLETED
            isMoveCompleted:
              type: boolean
              description: 완료·만료·취소 시 카드 종료 오버레이 표시
              example: true
            customer:
              type: object
              properties:
                name:
                  type: string
                  example: 김인서
            moveType:
              type: string
              enum: [SMALL, HOME, OFFICE]
              nullable: true
            isDesignated:
              type: boolean
              example: false
            designatedMoverId:
              type: integer
              nullable: true
              description: EstimateDesignatedMover.id (지정 채팅방 생성용). 비지정이면 null
            requestedAt:
              type: string
              format: date-time
              nullable: true
              example: '2024-08-01T00:00:00.000Z'
            moveDate:
              type: string
              format: date
              nullable: true
              example: '2024-08-26'
            fromAddress:
              type: string
              nullable: true
              example: 서울 중구 삼일대로 343
            toAddress:
              type: string
              nullable: true
              example: 서울 강남구 선릉로 428
    RejectedQuoteListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        estimateRequestId:
          type: integer
          example: 101
        customer:
          type: object
          properties:
            name:
              type: string
              example: 김인서
        moveType:
          type: string
          enum: [SMALL, HOME, OFFICE]
          nullable: true
        isDesignated:
          type: boolean
          example: false
        designatedMoverId:
          type: integer
          nullable: true
          description: EstimateDesignatedMover.id (지정 채팅방 생성용). 비지정이면 null
        moveDate:
          type: string
          format: date
          nullable: true
          example: '2024-08-26'
        fromRegionLabel:
          type: string
          nullable: true
          example: 서울 중구
        toRegionLabel:
          type: string
          nullable: true
          example: 경기도 수원시
        createdAt:
          type: string
          format: date-time
          example: '2024-08-01T10:00:00.000Z'
    SentQuoteListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        estimateRequestId:
          type: integer
          example: 101
        customer:
          type: object
          properties:
            name:
              type: string
              example: 김인서
        moveType:
          type: string
          enum: [SMALL, HOME, OFFICE]
          nullable: true
        isConfirmed:
          type: boolean
          example: false
        isDesignated:
          type: boolean
          example: false
        designatedMoverId:
          type: integer
          nullable: true
          description: EstimateDesignatedMover.id (지정 채팅방 생성용). 비지정이면 null
        moveDate:
          type: string
          format: date
          nullable: true
          example: '2024-08-26'
        fromRegionLabel:
          type: string
          nullable: true
          example: 서울 중구
        toRegionLabel:
          type: string
          nullable: true
          example: 경기도 수원시
        price:
          type: integer
          nullable: true
          example: 180000
        estimateRequestStatus:
          type: string
          enum: [DRAFT, SUBMITTED, CONFIRMED, COMPLETED, EXPIRED, CANCELED]
          description: 연결된 견적 요청 상태
          example: COMPLETED
        isMoveCompleted:
          type: boolean
          description: 완료·만료·취소 시 카드 종료 오버레이 표시
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2024-08-01T10:00:00.000Z'
    QuoteListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/RejectedQuoteListItem'
                  - $ref: '#/components/schemas/SentQuoteListItem'
        meta:
          type: object
          properties:
            totalCount:
              type: integer
              example: 32
              description: 전체 견적 개수
            totalPages:
              type: integer
              example: 4
              description: 전체 페이지 수
            currentPage:
              type: integer
              example: 1
              description: 현재 페이지 번호
            limit:
              type: integer
              example: 8
              description: 페이지당 조회 개수
            hasNextPage:
              type: boolean
              example: true
              description: 다음 페이지 존재 여부
            hasPrevPage:
              type: boolean
              example: false
              description: 이전 페이지 존재 여부

paths:
  /api/users/movers/estimate-requests:
    get:
      tags: [Movers]
      summary: 기사님이 받은 견적 요청 목록 조회
      description: |
        기사(Mover)에게 들어온 견적 요청 목록을 커서 기반으로 조회합니다.
        이미 견적을 제출/반려했거나, 견적이 확정되었거나, 이사일이 지난 요청은 기본적으로 제외됩니다.
        Access Token이 필요하며, userType이 MOVER인 계정만 접근할 수 있습니다.
        기사 프로필 등록이 완료되지 않은 경우 404(PROFILE_NOT_REGISTERED)를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: |
            고객 이름 또는 출발지·도착지 시·구 라벨 검색.
            주소는 화면과 같은 시·구 단위(앞 1~2토큰)만 매칭하며,
            도로명·번지 등 상세 주소로는 검색되지 않습니다.
            시/도 표기는 alias로 확장됩니다 (예: 경기 ↔ 경기도).
            (예: 서울, 강서구, 서울 강서구, 경기 고양시)
          schema:
            type: string
        - name: moveType
          in: query
          required: false
          description: 이사 유형 필터 (다중 선택 가능, 콤마 구분 또는 반복 파라미터)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [SMALL, HOME, OFFICE]
        - name: designated
          in: query
          required: false
          description: |
            true 인 경우 기사님에게 직접 지정된 견적 요청을 조회.
            serviceArea=true 와 함께 전달되면 OR 조건(지정 견적 ∪ 서비스 가능 지역)으로 필터한다.
          schema:
            type: boolean
        - name: serviceArea
          in: query
          required: false
          description: |
            true 인 경우 기사님의 서비스 가능 지역과 매칭되는 요청을 조회.
            designated=true 와 함께 전달되면 OR 조건(지정 견적 ∪ 서비스 가능 지역)으로 필터한다.
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: |
            정렬 조건 (기본값 MOVE_DATE_ASC)
            - MOVE_DATE_ASC: 이사일 빠른 순. 이사일이 같으면 요청일시(submittedAt) 최신순
            - SUBMITTED_AT_ASC: 요청일시 오래된 순
          schema:
            type: string
            enum: [MOVE_DATE_ASC, SUBMITTED_AT_ASC]
            default: MOVE_DATE_ASC
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 meta.nextCursor 값 (무한 스크롤 다음 페이지 조회 시 사용)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지당 조회 개수 (기본값 10, 최대 20)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: 견적 요청 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateRequestListResponse'
        '400':
          description: 유효하지 않은 정렬/필터 값
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 요청 파라미터입니다.
        '401':
          description: Access Token 누락 또는 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '403':
          description: MOVER가 아닌 계정으로 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_TYPE_FORBIDDEN
                  message: 접근 권한이 없습니다.
        '404':
          description: 기사 프로필 미등록 (PROFILE_NOT_REGISTERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: PROFILE_NOT_REGISTERED
                  message: 등록된 기사님 프로필이 없습니다. 프로필을 먼저 등록해 주세요.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/users/movers/estimate-requests/{estimateRequestId}/quotes:
    post:
      tags: [Movers]
      summary: 견적 보내기 / 반려하기
      description: |
        단일 엔드포인트에서 Request Body의 'type' 필드에 따라 기능을 분기합니다.
        - 'PROPOSAL': 견적 보내기 (price, comment 필수)
        - 'REJECTION': 반려하기 (rejectReason 필수)
        - confirmedQuoteId가 설정된(견적 확정된) 요청은 보내기/반려 모두 불가

        동시성 제어:
        - 지정 견적·일반 견적은 각각 독립 한도(지정 최대 3개 / 일반 최대 5개)로 PROPOSAL 접수
        - 'SELECT ... FOR UPDATE' 비관적 락으로 Race Condition 방어
        - '(estimateRequestId, moverId)' 유니크 제약으로 중복 제출(따닥) 방어
        - 반려(REJECTION)는 마감 인원 카운트에서 제외

        Access Token이 필요하며, userType이 MOVER인 계정만 접근할 수 있습니다.
        기사 프로필 등록이 완료되지 않은 경우 404(PROFILE_NOT_REGISTERED)를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: estimateRequestId
          in: path
          required: true
          description: 견적 요청 ID
          schema:
            type: integer
            minimum: 1
            example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteSubmitRequest'
            examples:
              proposal:
                summary: 견적 보내기
                value:
                  type: PROPOSAL
                  price: 150000
                  comment: 안전하고 신속하게 이사 도와드리겠습니다.
              rejection:
                summary: 반려하기
                value:
                  type: REJECTION
                  rejectReason: 해당 일정에 이미 다른 이사가 예약되어 있습니다.
      responses:
        '201':
          description: 견적 제출 또는 반려 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
              examples:
                proposal:
                  summary: 견적 보내기 성공
                  value:
                    data:
                      id: 1
                      estimateRequestId: 101
                      moverId: dummy-mover-uuid
                      price: 150000
                      comment: 안전하고 신속하게 이사 도와드리겠습니다.
                      rejectReason: null
                      status: PENDING
                      isDesignated: false
                      createdAt: '2026-07-27T08:00:00.000Z'
                      updatedAt: '2026-07-27T08:00:00.000Z'
                      deletedAt: null
                rejection:
                  summary: 반려하기 성공
                  value:
                    data:
                      id: 2
                      estimateRequestId: 101
                      moverId: dummy-mover-uuid
                      price: null
                      comment: null
                      rejectReason: 해당 일정에 이미 다른 이사가 예약되어 있습니다.
                      status: REJECTED
                      isDesignated: true
                      createdAt: '2026-07-27T08:00:00.000Z'
                      updatedAt: '2026-07-27T08:00:00.000Z'
                      deletedAt: null
        '400':
          description: 요청 Body / Path Parameter 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST_BODY
                  message: 요청 본문 형식이 올바르지 않습니다.
        '401':
          description: Access Token 누락 또는 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '403':
          description: |
            접근 거부
            - USER_TYPE_FORBIDDEN: MOVER가 아닌 계정으로 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userTypeForbidden:
                  summary: MOVER가 아닌 계정
                  value:
                    error:
                      code: USER_TYPE_FORBIDDEN
                      message: 접근 권한이 없습니다.
        '404':
          description: |
            기사 프로필 미등록(PROFILE_NOT_REGISTERED) 또는
            견적 요청 없음(ESTIMATE_REQUEST_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                profileNotRegistered:
                  summary: 기사 프로필 미등록
                  value:
                    error:
                      code: PROFILE_NOT_REGISTERED
                      message: 등록된 기사님 프로필이 없습니다. 프로필을 먼저 등록해 주세요.
                estimateRequestNotFound:
                  summary: 견적 요청 없음
                  value:
                    error:
                      code: ESTIMATE_REQUEST_NOT_FOUND
                      message: 존재하지 않는 견적 요청입니다.
        '409':
          description: |
            비즈니스 충돌
            - REQUEST_EXPIRED: 만료(EXPIRED) 또는 이사일 경과
            - REQUEST_CANCELED: 취소된 견적 요청
            - REQUEST_CLOSED: 견적 제출 인원 마감 (지정 3 / 일반 5)
            - QUOTE_ALREADY_SUBMITTED: 이미 견적 제출
            - ALREADY_REJECTED: 이미 반려
            - ALREADY_CONFIRMED_REQUEST: 견적 확정된 요청에 대한 보내기/반려 시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired:
                  summary: 만료 또는 이사일 경과
                  value:
                    error:
                      code: REQUEST_EXPIRED
                      message: 이사일이 지나 견적 요청이 만료되었습니다.
                canceled:
                  summary: 취소된 견적 요청
                  value:
                    error:
                      code: REQUEST_CANCELED
                      message: 취소된 견적 요청입니다.
                closed:
                  summary: 인원 마감
                  value:
                    error:
                      code: REQUEST_CLOSED
                      message: 견적 제출 가능 인원이 마감되었습니다.
                alreadySubmitted:
                  summary: 중복 견적 제출
                  value:
                    error:
                      code: QUOTE_ALREADY_SUBMITTED
                      message: 이미 견적을 제출한 요청입니다.
                alreadyRejected:
                  summary: 이미 반려
                  value:
                    error:
                      code: ALREADY_REJECTED
                      message: 이미 반려한 견적 요청입니다.
                alreadyConfirmed:
                  summary: 견적 확정됨
                  value:
                    error:
                      code: ALREADY_CONFIRMED_REQUEST
                      message: 이미 예약이 확정된 이사 요청입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/users/movers/quotes:
    get:
      tags: [Movers]
      summary: 보낸 견적 / 반려한 견적 목록 조회
      description: |
        status 쿼리 파라미터에 따라 목록을 분기 조회합니다.
        - REJECTED: 반려한 견적 요청 목록
        - SENT: 보낸 견적 목록 (PENDING, CONFIRMED)

        Offset 기반 페이지네이션을 사용하며, 기본 limit은 8입니다.
        Access Token이 필요하며, userType이 MOVER인 계정만 접근할 수 있습니다.
        기사 프로필 등록이 완료되지 않은 경우 404(PROFILE_NOT_REGISTERED)를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          description: 목록 분기 조건 (REJECTED | SENT)
          schema:
            type: string
            enum: [REJECTED, SENT]
        - name: page
          in: query
          required: false
          description: 페이지 번호 (기본값 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: 페이지당 조회 개수 (기본값 8, 최대 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        '200':
          description: 견적 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListResponse'
              examples:
                rejected:
                  summary: 반려한 견적 목록
                  value:
                    data:
                      items:
                        - id: 1
                          estimateRequestId: 101
                          customer:
                            name: 김인서
                          moveType: HOME
                          isDesignated: false
                          moveDate: '2024-08-26'
                          fromRegionLabel: 서울 중구
                          toRegionLabel: 경기도 수원시
                          createdAt: '2024-08-01T10:00:00.000Z'
                    meta:
                      totalCount: 15
                      totalPages: 2
                      currentPage: 1
                      limit: 8
                      hasNextPage: true
                      hasPrevPage: false
                sent:
                  summary: 보낸 견적 목록
                  value:
                    data:
                      items:
                        - id: 2
                          estimateRequestId: 102
                          customer:
                            name: 김인서
                          moveType: HOME
                          isConfirmed: false
                          isDesignated: false
                          moveDate: '2024-08-26'
                          fromRegionLabel: 서울 중구
                          toRegionLabel: 경기도 수원시
                          price: 180000
                          isMoveCompleted: false
                          createdAt: '2024-08-01T10:00:00.000Z'
                    meta:
                      totalCount: 32
                      totalPages: 4
                      currentPage: 1
                      limit: 8
                      hasNextPage: true
                      hasPrevPage: false
        '400':
          description: 유효하지 않은 쿼리 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 요청 파라미터입니다.
        '401':
          description: Access Token 누락 또는 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '403':
          description: MOVER가 아닌 계정으로 접근
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_TYPE_FORBIDDEN
                  message: 접근 권한이 없습니다.
        '404':
          description: 기사 프로필 미등록 (PROFILE_NOT_REGISTERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: PROFILE_NOT_REGISTERED
                  message: 등록된 기사님 프로필이 없습니다. 프로필을 먼저 등록해 주세요.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/users/movers/quotes/{quoteId}:
    get:
      tags: [Movers]
      summary: 보낸 견적 / 반려 견적 상세 조회
      description: |
        기사님 본인의 견적(PENDING, CONFIRMED, REJECTED)을 상세 조회할 수 있습니다.
        Access Token이 필요하며, userType이 MOVER인 계정만 접근할 수 있습니다.
        기사 프로필 등록이 완료되지 않은 경우 404(PROFILE_NOT_REGISTERED)를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: quoteId
          in: path
          required: true
          description: 견적 ID
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: 견적 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetailResponse'
              example:
                data:
                  id: 1
                  estimateRequestId: 101
                  price: 180000
                  status: CONFIRMED
                  comment: 안전하고 신속하게 이사 도와드리겠습니다.
                  rejectReason: null
                  isMoveCompleted: false
                  customer:
                    name: 김인서
                  moveType: OFFICE
                  isDesignated: false
                  requestedAt: '2024-08-01T00:00:00.000Z'
                  moveDate: '2024-08-26'
                  fromAddress: 서울 중구 삼일대로 343
                  toAddress: 서울 강남구 선릉로 428
        '400':
          description: Path Parameter 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST
                  message: 요청 형식이 올바르지 않습니다.
        '401':
          description: Access Token 누락 또는 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '403':
          description: |
            접근 거부
            - USER_TYPE_FORBIDDEN: MOVER가 아닌 계정으로 접근
            - FORBIDDEN: 본인 견적이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userTypeForbidden:
                  summary: MOVER가 아닌 계정
                  value:
                    error:
                      code: USER_TYPE_FORBIDDEN
                      message: 접근 권한이 없습니다.
                forbidden:
                  summary: 본인 견적 아님
                  value:
                    error:
                      code: FORBIDDEN
                      message: 해당 기능에 접근할 수 없습니다.
        '404':
          description: |
            기사 프로필 미등록(PROFILE_NOT_REGISTERED) 또는
            견적 없음(QUOTE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                profileNotRegistered:
                  summary: 기사 프로필 미등록
                  value:
                    error:
                      code: PROFILE_NOT_REGISTERED
                      message: 등록된 기사님 프로필이 없습니다. 프로필을 먼저 등록해 주세요.
                quoteNotFound:
                  summary: 견적 없음
                  value:
                    error:
                      code: QUOTE_NOT_FOUND
                      message: 존재하지 않거나 삭제된 견적서입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
