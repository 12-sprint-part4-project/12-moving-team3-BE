paths:
  /api/admin/estimate-requests:
    get:
      tags: [Admin Estimate Requests]
      summary: 관리자 견적 요청 목록 조회
      description: |
        관리 대상 견적 요청을 조회합니다.
        sort로 제출일 오름차순(ASC) 또는 최신순(DESC, 기본값)을 선택할 수 있으며,
        동일 제출일은 id desc로 보조 정렬합니다.
        status를 지정하면 해당 상태만 조회하며, 미지정 시 DRAFT·COMPLETED를 제외한
        SUBMITTED, CONFIRMED, EXPIRED, CANCELED 상태를 모두 조회합니다.
        id는 견적 요청 ID 정확 일치, userName은 요청자 이름 부분 일치,
        phoneNumber는 숫자만 추출해 전화번호 부분 일치로 필터합니다.
        여러 조건을 함께 보내면 AND로 적용됩니다.
        startDate가 없으면 전체 기간을 조회하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일의 제출 요청을 조회하고, endDate도 입력하면 두 날짜 사이의 제출 요청을 조회합니다.
        제출 후 필수값이 누락된 불완전 데이터는 500 대신 해당 필드를 null로 내리고
        missingFields에 누락 필드명을 담아 반환합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: |
            견적 요청 상태 필터
            (미입력 시 DRAFT·COMPLETED 제외 — SUBMITTED, CONFIRMED, EXPIRED, CANCELED)
          schema:
            type: string
            enum: [SUBMITTED, CONFIRMED, EXPIRED, CANCELED]
            example: SUBMITTED
        - name: id
          in: query
          required: false
          description: 견적 요청 ID (1 이상)
          schema:
            type: integer
            minimum: 1
            example: 26
        - name: userName
          in: query
          required: false
          description: 요청자 이름 부분 검색 (앞뒤 공백 제거, 빈 문자열 불가)
          schema:
            type: string
            minLength: 1
            example: 홍길동
        - name: phoneNumber
          in: query
          required: false
          description: |
            요청자 전화번호 부분 검색.
            하이픈 등 비숫자는 무시하고, 숫자만 남겨 매칭합니다.
            숫자만 추출했을 때 길이가 1 이상이어야 합니다.
          schema:
            type: string
            minLength: 1
            example: '010-1234'
        - name: startDate
          in: query
          required: false
          description: 제출일 조회 시작일 (미입력 시 전체 기간)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 제출일 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
        - name: sort
          in: query
          required: false
          description: |
            제출일 정렬 조건 (미입력 시 DESC).
            동일 제출일은 id desc로 보조 정렬합니다.
          schema:
            type: string
            enum: [ASC, DESC]
            example: DESC
        - name: page
          in: query
          required: false
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: 페이지당 조회 개수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
      responses:
        '200':
          description: 견적 요청 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - userName
                        - phoneNumber
                        - moveType
                        - departureAddress
                        - arrivalAddress
                        - submittedAt
                        - status
                        - estimateCount
                        - mover
                        - missingFields
                      properties:
                        id:
                          type: integer
                          example: 123
                        userName:
                          type: string
                          example: 홍길동
                        phoneNumber:
                          type: string
                          nullable: true
                          example: '010-1234-5678'
                        moveType:
                          type: string
                          nullable: true
                          enum: [SMALL, HOME, OFFICE]
                          description: 누락 시 null. missingFields에 moveType 포함
                          example: HOME
                        departureAddress:
                          type: string
                          nullable: true
                          description: 누락 시 null
                          example: 서울특별시 강남구 테헤란로 123
                        arrivalAddress:
                          type: string
                          nullable: true
                          description: 누락 시 null
                          example: 서울특별시 송파구 올림픽로 456
                        submittedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 누락 시 null
                          example: '2026-07-15T09:30:00.000Z'
                        status:
                          type: string
                          enum: [SUBMITTED, CONFIRMED, EXPIRED, CANCELED]
                          example: SUBMITTED
                        estimateCount:
                          type: integer
                          minimum: 0
                          description: 삭제되지 않은 견적 수 (soft delete 제외)
                          example: 3
                        mover:
                          type: string
                          nullable: true
                          description: 확정된 견적의 이사 기사명. 확정 견적이 없으면 null
                          example: 빠른이사
                        missingFields:
                          type: array
                          description: |
                            상태 불변식상 있어야 하지만 null인 응답 필드명.
                            정상 데이터면 빈 배열
                          items:
                            type: string
                            enum:
                              [
                                moveType,
                                departureAddress,
                                arrivalAddress,
                                submittedAt,
                              ]
                          example: []
                  meta:
                    type: object
                    required: [page, pageSize, totalCount, totalPages]
                    properties:
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10
                      totalCount:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 5
              example:
                data:
                  - id: 123
                    userName: 홍길동
                    phoneNumber: '010-1234-5678'
                    moveType: HOME
                    departureAddress: 서울특별시 강남구 테헤란로 123
                    arrivalAddress: 서울특별시 송파구 올림픽로 456
                    submittedAt: '2026-07-15T09:30:00.000Z'
                    status: SUBMITTED
                    estimateCount: 3
                    mover: null
                    missingFields: []
                meta:
                  page: 1
                  pageSize: 10
                  totalCount: 42
                  totalPages: 5
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/estimate-requests/statistics:
    get:
      tags: [Admin Estimate Requests]
      summary: 관리자 견적 요청 통계 조회
      description: |
        기간 조건에 따른 견적 요청 상태별 건수를 조회합니다.
        SUBMITTED, CONFIRMED, EXPIRED, CANCELED 상태별 건수를 반환합니다.
        startDate가 없으면 전체 기간을 집계하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일(00:00:00 ~ 23:59:59)을 집계하고,
        endDate도 입력하면 두 날짜 사이를 집계합니다.
        기간 필터는 제출일(submittedAt) 기준입니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
      responses:
        '200':
          description: 견적 요청 통계 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - submitted
                      - confirmed
                      - expired
                      - canceled
                    properties:
                      submitted:
                        type: integer
                        description: SUBMITTED 상태 견적 요청 수
                        example: 30
                      confirmed:
                        type: integer
                        description: CONFIRMED 상태 견적 요청 수
                        example: 15
                      expired:
                        type: integer
                        description: EXPIRED 상태 견적 요청 수
                        example: 5
                      canceled:
                        type: integer
                        description: CANCELED 상태 견적 요청 수
                        example: 3
              example:
                data:
                  submitted: 30
                  confirmed: 15
                  expired: 5
                  canceled: 3
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/estimate-requests/{estimateRequestId}:
    get:
      tags: [Admin Estimate Requests]
      summary: 관리자 견적 요청 상세 조회
      description: |
        견적 요청 ID로 상세 정보와 연결된 견적 목록을 조회합니다.
        SUBMITTED, CONFIRMED, EXPIRED, CANCELED 상태만 조회할 수 있습니다.
        DRAFT 또는 COMPLETED 상태이거나 존재하지 않는 ID면 404를 반환합니다.
        출발지·도착지 주소 상세(우편번호, 상세주소)와 견적 목록을 함께 반환합니다.
        견적은 soft delete 여부에 따라 activeQuotes·deletedQuotes로 분리되며,
        각각 생성일 최신순(createdAt desc, id desc)으로 정렬됩니다.
        삭제된 견적 UI 표시는 deletedQuotes 배열 소속으로 판별하며, deletedAt은 응답에 포함하지 않습니다.
        반려(REJECTED) 견적은 price가 null일 수 있습니다.
        요청자 닉네임(userNickname)과 각 견적의 기사 닉네임(moverNickname)을 함께 반환합니다.
        필수값이 누락된 불완전 데이터는 500 대신 해당 필드를 null로 내리고
        missingFields에 누락 필드명을 담아 반환합니다. mover가 없으면 moverName·moverNickname은 null입니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: estimateRequestId
          in: path
          required: true
          description: 조회할 견적 요청 ID
          schema:
            type: integer
            minimum: 1
            example: 123
      responses:
        '200':
          description: 견적 요청 상세 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - userName
                      - userNickname
                      - moveType
                      - departureAddress
                      - departureDetailAddress
                      - departureZipCode
                      - arrivalAddress
                      - arrivalZipCode
                      - arrivalDetailAddress
                      - submittedAt
                      - status
                      - activeQuotesCount
                      - deletedQuotesCount
                      - activeQuotes
                      - deletedQuotes
                      - missingFields
                    properties:
                      id:
                        type: integer
                        example: 123
                      userName:
                        type: string
                        example: 홍길동
                      userNickname:
                        type: string
                        description: 요청자 닉네임
                        example: 길동이
                      moveType:
                        type: string
                        nullable: true
                        enum: [SMALL, HOME, OFFICE]
                        example: HOME
                      departureAddress:
                        type: string
                        nullable: true
                        example: 서울특별시 강남구 테헤란로 123
                      departureDetailAddress:
                        type: string
                        nullable: true
                        example: 101동 1001호
                      departureZipCode:
                        type: string
                        nullable: true
                        example: '06236'
                      arrivalAddress:
                        type: string
                        nullable: true
                        example: 서울특별시 송파구 올림픽로 456
                      arrivalZipCode:
                        type: string
                        nullable: true
                        example: '05551'
                      arrivalDetailAddress:
                        type: string
                        nullable: true
                        example: A동 502호
                      submittedAt:
                        type: string
                        format: date-time
                        nullable: true
                        example: '2026-07-15T09:30:00.000Z'
                      status:
                        type: string
                        enum: [SUBMITTED, CONFIRMED, EXPIRED, CANCELED]
                        description: DRAFT·COMPLETED는 상세 조회 대상이 아님
                        example: SUBMITTED
                      activeQuotesCount:
                        type: integer
                        minimum: 0
                        description: 삭제되지 않은 견적 수
                        example: 2
                      deletedQuotesCount:
                        type: integer
                        minimum: 0
                        description: soft delete된 견적 수
                        example: 1
                      activeQuotes:
                        type: array
                        description: 삭제되지 않은 견적 목록 (생성일 최신순)
                        items:
                          type: object
                          required:
                            - id
                            - moverName
                            - moverNickname
                            - price
                            - status
                            - createdAt
                          properties:
                            id:
                              type: integer
                              example: 11
                            moverName:
                              type: string
                              nullable: true
                              description: 기사 정보가 없으면 null
                              example: 안전이사
                            moverNickname:
                              type: string
                              nullable: true
                              description: 기사 닉네임. 기사 정보가 없으면 null
                              example: 안전맨
                            price:
                              type: integer
                              nullable: true
                              description: 견적 금액. 반려 견적 등에서는 null일 수 있음
                              example: 180000
                            status:
                              type: string
                              enum: [PENDING, CONFIRMED, REJECTED]
                              description: 견적 업무 상태. 활성 목록에서는 이 값으로 UI 상태를 표시
                              example: PENDING
                            createdAt:
                              type: string
                              format: date-time
                              example: '2026-07-16T14:00:00.000Z'
                      deletedQuotes:
                        type: array
                        description: |
                          soft delete된 견적 목록 (생성일 최신순).
                          UI 표시 상태는 배열 소속으로 "삭제"로 판별하며, status는 참고용
                        items:
                          type: object
                          required:
                            - id
                            - moverName
                            - moverNickname
                            - price
                            - status
                            - createdAt
                          properties:
                            id:
                              type: integer
                              example: 10
                            moverName:
                              type: string
                              nullable: true
                              description: 기사 정보가 없으면 null
                              example: 빠른이사
                            moverNickname:
                              type: string
                              nullable: true
                              description: 기사 닉네임. 기사 정보가 없으면 null
                              example: 빠른이사맨
                            price:
                              type: integer
                              nullable: true
                              description: 견적 금액. 반려 견적 등에서는 null일 수 있음
                              example: 150000
                            status:
                              type: string
                              enum: [PENDING, CONFIRMED, REJECTED]
                              description: 삭제 시점의 업무 상태. UI "삭제" 표시에는 사용하지 않음
                              example: PENDING
                            createdAt:
                              type: string
                              format: date-time
                              example: '2026-07-16T11:00:00.000Z'
                      missingFields:
                        type: array
                        description: 상태 불변식상 있어야 하지만 null인 응답 필드명. 정상 데이터면 빈 배열
                        items:
                          type: string
                        example: []
              example:
                data:
                  id: 123
                  userName: 홍길동
                  userNickname: 길동이
                  moveType: HOME
                  departureAddress: 서울특별시 강남구 테헤란로 123
                  departureDetailAddress: 101동 1001호
                  departureZipCode: '06236'
                  arrivalAddress: 서울특별시 송파구 올림픽로 456
                  arrivalZipCode: '05551'
                  arrivalDetailAddress: A동 502호
                  submittedAt: '2026-07-15T09:30:00.000Z'
                  status: SUBMITTED
                  activeQuotesCount: 2
                  deletedQuotesCount: 1
                  activeQuotes:
                    - id: 11
                      moverName: 안전이사
                      moverNickname: 안전맨
                      price: 180000
                      status: PENDING
                      createdAt: '2026-07-16T14:00:00.000Z'
                    - id: 12
                      moverName: 빠른이사
                      moverNickname: 빠른이사맨
                      price: null
                      status: REJECTED
                      createdAt: '2026-07-16T11:00:00.000Z'
                  deletedQuotes:
                    - id: 10
                      moverName: 든든이사
                      moverNickname: 든든맨
                      price: 160000
                      status: PENDING
                      createdAt: '2026-07-16T10:00:00.000Z'
                  missingFields: []
        '400':
          description: Path Parameter(estimateRequestId) 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '404':
          description: 견적 요청이 없거나 DRAFT 또는 COMPLETED 상태인 경우
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_ESTIMATE_REQUEST_NOT_FOUND
                  message: 존재하지 않는 견적 요청입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
