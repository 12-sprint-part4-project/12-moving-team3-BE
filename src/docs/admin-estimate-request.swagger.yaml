paths:
  /api/admin/estimate-request:
    get:
      tags: [Admin Estimate Requests]
      summary: 관리자 견적 요청 목록 조회
      description: |
        SUBMITTED 또는 CONFIRMED 상태의 견적 요청을 제출일 최신순으로 조회합니다.
        status를 지정하면 해당 상태만 조회하며, 미지정 시 두 상태를 모두 조회합니다.
        search는 견적 요청 ID(정수), 요청자 이름 또는 전화번호를 대상으로 검색합니다.
        startDate가 없으면 전체 기간을 조회하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일의 제출 요청을 조회하고, endDate도 입력하면 두 날짜 사이의 제출 요청을 조회합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 견적 요청 상태 필터 (미입력 시 SUBMITTED, CONFIRMED 모두 조회)
          schema:
            type: string
            enum: [SUBMITTED, CONFIRMED]
            example: SUBMITTED
        - name: search
          in: query
          required: false
          description: 견적 요청 ID, 요청자 이름 또는 전화번호 검색어
          schema:
            type: string
            minLength: 1
            example: 홍길동
        - name: startDate
          in: query
          required: false
          description: 제출일 조회 시작일 (미입력 시 전체 기간)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 제출일 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
        - name: page
          in: query
          required: false
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: 페이지당 조회 개수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
      responses:
        '200':
          description: 견적 요청 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - userName
                        - phoneNumber
                        - moveType
                        - departureAddress
                        - arrivalAddress
                        - submittedAt
                        - status
                        - estimateCount
                        - mover
                      properties:
                        id:
                          type: integer
                          example: 123
                        userName:
                          type: string
                          example: 홍길동
                        phoneNumber:
                          type: string
                          nullable: true
                          example: '010-1234-5678'
                        moveType:
                          type: string
                          enum: [SMALL, HOME, OFFICE]
                          example: HOME
                        departureAddress:
                          type: string
                          example: 서울특별시 강남구 테헤란로 123
                        arrivalAddress:
                          type: string
                          example: 서울특별시 송파구 올림픽로 456
                        submittedAt:
                          type: string
                          format: date-time
                          example: '2026-07-15T09:30:00.000Z'
                        status:
                          type: string
                          enum: [SUBMITTED, CONFIRMED]
                          example: SUBMITTED
                        estimateCount:
                          type: integer
                          minimum: 0
                          description: 해당 견적 요청에 등록된 견적 수
                          example: 3
                        mover:
                          type: string
                          nullable: true
                          description: 확정된 견적의 이사 기사명. 확정 견적이 없으면 null
                          example: 빠른이사
                  meta:
                    type: object
                    required: [page, pageSize, totalCount, totalPages]
                    properties:
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10
                      totalCount:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 5
              example:
                data:
                  - id: 123
                    userName: 홍길동
                    phoneNumber: '010-1234-5678'
                    moveType: HOME
                    departureAddress: 서울특별시 강남구 테헤란로 123
                    arrivalAddress: 서울특별시 송파구 올림픽로 456
                    submittedAt: '2026-07-15T09:30:00.000Z'
                    status: SUBMITTED
                    estimateCount: 3
                    mover: null
                meta:
                  page: 1
                  pageSize: 10
                  totalCount: 42
                  totalPages: 5
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/estimate-request/statistics:
    get:
      tags: [Admin Estimate Requests]
      summary: 관리자 견적 요청 통계 조회
      description: |
        기간 조건에 따른 활성 견적 요청 통계를 조회합니다.
        활성 견적 요청은 SUBMITTED 또는 CONFIRMED 상태입니다.
        startDate가 없으면 전체 기간을 집계하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일(00:00:00 ~ 23:59:59)을 집계하고,
        endDate도 입력하면 두 날짜 사이를 집계합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
      responses:
        '200':
          description: 견적 요청 통계 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - totalActiveEstimateRequestCount
                      - submittedEstimateRequestCount
                      - confirmedEstimateRequestCount
                    properties:
                      totalActiveEstimateRequestCount:
                        type: integer
                        description: SUBMITTED와 CONFIRMED 상태 견적 요청의 합계
                        example: 45
                      submittedEstimateRequestCount:
                        type: integer
                        description: SUBMITTED 상태 견적 요청 수
                        example: 30
                      confirmedEstimateRequestCount:
                        type: integer
                        description: CONFIRMED 상태 견적 요청 수
                        example: 15
              example:
                data:
                  totalActiveEstimateRequestCount: 45
                  submittedEstimateRequestCount: 30
                  confirmedEstimateRequestCount: 15
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
