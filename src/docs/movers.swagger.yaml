paths:
  /api/movers:
    get:
      tags: [Movers]
      summary: 기사님 목록 조회
      description: |
        기사 프로필 목록을 조회합니다.
        keyword, region, moveType, sort, cursor, limit 쿼리로 필터·정렬·무한 스크롤 조회할 수 있습니다.
        정렬은 모두 내림차순(리뷰·평점·경력·확정 많은/높은 순)입니다.
        회원/비회원 모두 접근 가능합니다.
        Authorization Bearer가 있고 CUSTOMER이면 각 항목의 isFavorited에 찜 여부를 반영합니다.
        비회원·기사·미찜은 모두 isFavorited: false 입니다.
        각 항목의 favoritedCount는 해당 기사가 받은 총 찜 수이며, 로그인 여부와 무관하게 포함됩니다.
      parameters:
        - name: keyword
          in: query
          required: false
          description: 닉네임·소개글 검색어
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: 활동 지역 (Region enum, 복수 가능)
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: moveType
          in: query
          required: false
          description: 제공 서비스 (SMALL | HOME | OFFICE, 복수 가능)
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
                enum: [SMALL, HOME, OFFICE]
              - type: array
                items:
                  type: string
                  enum: [SMALL, HOME, OFFICE]
        - name: sort
          in: query
          required: false
          description: >
            정렬 필드 (모두 내림차순).
            미지정 시 reviewCount.
            reviewCount·averageRating·confirmedCount는 리뷰/견적 집계 기준.
          schema:
            type: string
            enum:
              [reviewCount, averageRating, career, confirmedCount]
            default: reviewCount
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 meta.nextCursor 값 (다음 페이지 조회 시 사용)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지당 개수
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          description: MoverProfile + review 통계 + isFavorited + favoritedCount
                  meta:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                        description: 다음 페이지 조회 시 cursor 파라미터로 전달
                      hasNextPage:
                        type: boolean
              example:
                data:
                  items:
                    - id: 12
                      userId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      service: [HOME, SMALL]
                      career: 5
                      description: 안전하고 꼼꼼한 이사 도와드립니다.
                      shortDescription: 경력 5년 이사 전문가
                      createdAt: '2026-01-10T08:00:00.000Z'
                      updatedAt: '2026-07-20T12:30:00.000Z'
                      user:
                        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        nickname: 빠른이사맨
                        profileImageUrl: https://cdn.example.com/profiles/mover-12.jpg
                      serviceRegions:
                        - id: 1
                          region: SEOUL
                        - id: 2
                          region: GYEONGGI
                      review:
                        ratingCounts:
                          1: 0
                          2: 1
                          3: 2
                          4: 5
                          5: 12
                        totalCount: 20
                        averageRating: 4.4
                      isFavorited: false
                      favoritedCount: 128
                meta:
                  nextCursor: eyJzb3J0IjoiY3JlYXRlZEF0X2Rlc2MiLCJ2YWx1ZSI6IjIwMjYtMDEtMTBUMDg6MDA6MDAuMDAwWiIsImlkIjoxMn0
                  hasNextPage: true
        '400':
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 정렬 또는 필터 값입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/movers/favorites:
    get:
      tags: [Movers]
      summary: 찜한 기사님 목록 조회
      description: |
        로그인한 고객(CUSTOMER)이 찜한 기사님 목록을 조회합니다.
        각 항목에 리뷰 통계(reviewStats), 총 찜 수(favoritedCount),
        이사유형(service), 확정 견적 건수(confirmedCount)가 포함됩니다.
        moverId는 기사님의 User id(UUID)입니다.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 meta.nextCursor 값 (다음 페이지 조회 시 사용)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지당 개수
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          description: Favorite + mover + reviewStats + favoritedCount + service + confirmedCount
                  meta:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                        description: 다음 페이지 조회 시 cursor 파라미터로 전달
                      hasNextPage:
                        type: boolean
              example:
                data:
                  items:
                    - id: 3
                      userId: c0ffeeee-0000-4000-8000-000000000001
                      moverId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      createdAt: '2026-07-15T10:00:00.000Z'
                      mover:
                        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        name: 김기사
                        profileImageUrl: https://cdn.example.com/profiles/mover-12.jpg
                        moverProfile:
                          career: 5
                          service: [HOME, SMALL]
                          serviceRegions:
                            - id: 1
                              region: SEOUL
                      reviewStats:
                        ratingCounts:
                          1: 0
                          2: 1
                          3: 2
                          4: 5
                          5: 12
                        totalCount: 20
                        averageRating: 4.4
                      favoritedCount: 128
                      service: [HOME, SMALL]
                      confirmedCount: 334
                meta:
                  nextCursor: null
                  hasNextPage: false
        '400':
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 정렬 또는 필터 값입니다.
        '401':
          description: 인증되지 않은 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요한 기능입니다.
        '403':
          description: CUSTOMER가 아닌 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_TYPE_FORBIDDEN
                  message: 접근 권한이 없습니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/movers/{id}/reviews:
    get:
      tags: [Movers]
      summary: 기사님 공개 리뷰 목록 조회
      description: |
        기사님 상세 페이지용 공개 리뷰 목록입니다.
        path의 id는 기사님 User UUID이며, 회원/비회원 모두 조회할 수 있습니다.
        응답 형태는 본인용 GET /api/review/mover 와 동일합니다.
        (data.reviews + meta.pagination + meta.ratingStatistics)
        목록·통계 조회 로직도 reviewService.getMoverReviews를 재사용합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 기사님의 User id (UUID)
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: 페이지 번호 (1부터)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: 페이지당 개수 (최대 6)
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 6
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reviews:
                        type: array
                        items:
                          $ref: '#/components/schemas/MoverReviewItem'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/ReviewPaginationMeta'
                      ratingStatistics:
                        $ref: '#/components/schemas/ReviewRatingStatistics'
              example:
                data:
                  reviews:
                    - id: 1
                      rating: 5
                      content: 친절하고 꼼꼼했어요.
                      createdAt: '2026-07-20T12:00:00.000Z'
                      customer:
                        id: c0ffeeee-0000-4000-8000-000000000001
                        name: 김고객
                meta:
                  pagination:
                    currentPage: 1
                    pageSize: 6
                    totalCount: 1
                    hasNextPage: false
                  ratingStatistics:
                    average: 5
                    five: 1
                    four: 0
                    three: 0
                    two: 0
                    one: 0
        '400':
          description: 잘못된 ID 또는 쿼리 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 요청 파라미터입니다.
        '404':
          description: 기사님 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MOVER_NOT_FOUND
                  message: 존재하지 않는 기사님입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/movers/{id}:
    get:
      tags: [Movers]
      summary: 기사님 상세 조회
      description: |
        기사님의 User id(UUID)로 상세 정보를 조회합니다.
        프로필과 리뷰 통계를 함께 반환합니다.
        회원/비회원 모두 접근 가능합니다.
        Authorization Bearer가 있고 CUSTOMER이면 isFavorited에 찜 여부를 반영합니다.
        비회원·기사·미찜은 모두 isFavorited: false 입니다.
        favoritedCount는 해당 기사가 받은 총 찜 수, confirmedCount는 확정 견적 건수이며
        로그인 여부와 무관하게 포함됩니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 기사님의 User id (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      moverDetail:
                        type: object
                        description: MoverProfile + user + serviceRegions
                      reviewStats:
                        type: object
                        properties:
                          ratingCounts:
                            type: object
                          totalCount:
                            type: integer
                          averageRating:
                            type: number
                            nullable: true
                      isFavorited:
                        type: boolean
                        description: |
                          로그인한 CUSTOMER가 해당 기사를 찜했는지 여부.
                          비회원·기사이거나 미찜이면 false.
                      favoritedCount:
                        type: integer
                        description: 해당 기사가 받은 총 찜 수
                      confirmedCount:
                        type: integer
                        description: 해당 기사의 확정 견적(CONFIRMED) 건수
              example:
                data:
                  moverDetail:
                    id: 12
                    userId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    service: [HOME, SMALL]
                    career: 5
                    description: 안전하고 꼼꼼한 이사 도와드립니다.
                    shortDescription: 경력 5년 이사 전문가
                    createdAt: '2026-01-10T08:00:00.000Z'
                    updatedAt: '2026-07-20T12:30:00.000Z'
                    user:
                      id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      name: 김기사
                      nickname: 빠른이사맨
                      profileImageUrl: https://cdn.example.com/profiles/mover-12.jpg
                    serviceRegions:
                      - id: 1
                        region: SEOUL
                  reviewStats:
                    ratingCounts:
                      1: 0
                      2: 1
                      3: 2
                      4: 5
                      5: 12
                    totalCount: 20
                    averageRating: 4.4
                  isFavorited: false
                  favoritedCount: 128
                  confirmedCount: 334
        '400':
          description: 잘못된 ID (UUID 형식 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 정렬 또는 필터 값입니다.
        '404':
          description: 기사님 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MOVER_NOT_FOUND
                  message: 존재하지 않는 기사님입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
