paths:
  /api/movers:
    get:
      tags: [Movers]
      summary: 기사님 목록 조회
      description: |
        기사 프로필 목록을 조회합니다.
        keyword, region, moveType, sort, order, page, limit 쿼리로 필터·정렬·페이지네이션할 수 있습니다.
      parameters:
        - name: keyword
          in: query
          required: false
          description: 닉네임·소개글 검색어
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: 활동 지역 (Region enum, 복수 가능)
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: moveType
          in: query
          required: false
          description: 제공 서비스 (SMALL | HOME | OFFICE, 복수 가능)
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
                enum: [SMALL, HOME, OFFICE]
              - type: array
                items:
                  type: string
                  enum: [SMALL, HOME, OFFICE]
        - name: sort
          in: query
          required: false
          description: 정렬 필드
          schema:
            type: string
            enum: [career, createdAt]
        - name: order
          in: query
          required: false
          description: 정렬 방향
          schema:
            type: string
            enum: [asc, desc]
        - name: page
          in: query
          required: false
          description: 페이지 번호 (1부터)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: 페이지당 개수
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 조회 성공
        '400':
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 정렬 또는 필터 값입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/movers/{id}:
    get:
      tags: [Movers]
      summary: 기사님 상세 조회
      description: 기사 프로필 ID(mover_profiles.id)로 상세 정보를 조회합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 기사 프로필 ID (mover_profiles.id)
          schema:
            type: integer
      responses:
        '200':
          description: 조회 성공
        '400':
          description: 잘못된 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_QUERY_PARAM
                  message: 유효하지 않은 정렬 또는 필터 값입니다.
        '404':
          description: 기사님 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MOVER_NOT_FOUND
                  message: 존재하지 않는 기사님입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
