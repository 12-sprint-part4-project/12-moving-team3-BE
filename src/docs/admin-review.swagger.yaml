paths:
  /api/admin/reviews/statistics:
    get:
      tags: [Admin Reviews]
      summary: 관리자 리뷰 통계 조회
      description: |
        기간 조건에 따른 리뷰 통계를 조회합니다.
        전체 리뷰 수와 평균 평점은 삭제되지 않은 리뷰를 기준으로 집계하며, 삭제된 리뷰 수는 별도로 집계합니다.
        startDate가 없으면 전체 기간을 집계하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일(00:00:00 ~ 23:59:59)을 집계하고,
        endDate도 입력하면 두 날짜 사이를 집계합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
      responses:
        '200':
          description: 리뷰 통계 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - totalReviewCount
                      - averageReviewScore
                      - deletedReviewCount
                    properties:
                      totalReviewCount:
                        type: integer
                        description: 삭제되지 않은 리뷰 수
                        example: 120
                      averageReviewScore:
                        type: number
                        format: float
                        description: 삭제되지 않은 리뷰의 평균 평점 (리뷰가 없으면 0)
                        example: 4.5
                      deletedReviewCount:
                        type: integer
                        description: 삭제된 리뷰 수
                        example: 3
              example:
                data:
                  totalReviewCount: 120
                  averageReviewScore: 4.5
                  deletedReviewCount: 3
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
