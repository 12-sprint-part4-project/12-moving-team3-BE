components:
  schemas:
    UserReportCreateRequest:
      type: object
      required: [target, targetId, category]
      properties:
        target:
          type: string
          enum: [USER, REVIEW, CHAT_ROOM, MESSAGE, ARTICLE, COMMENT]
          example: REVIEW
          description: 신고 대상 타입
        targetId:
          type: string
          maxLength: 36
          example: '42'
          description: |
            신고 대상 ID.
            USER는 UUID.
            그 외(REVIEW, ARTICLE 등)는 1 이상 2147483647(Postgres Int 상한) 이하의 양의 정수 문자열.
        category:
          type: string
          enum: [INAPPROPRIATE_PROFILE, ABUSIVE_LANGUAGE]
          example: ABUSIVE_LANGUAGE
          description: 신고 사유 카테고리

    UserReportDetail:
      type: object
      required:
        [id, reporterId, target, targetId, category, status, createdAt]
      properties:
        id:
          type: integer
          example: 1
        reporterId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        target:
          type: string
          enum: [USER, REVIEW, CHAT_ROOM, MESSAGE, ARTICLE, COMMENT]
          example: REVIEW
        targetId:
          type: string
          example: '42'
        category:
          type: string
          enum: [INAPPROPRIATE_PROFILE, ABUSIVE_LANGUAGE]
          example: ABUSIVE_LANGUAGE
        status:
          type: string
          enum: [PENDING, RESOLVED, REJECTED]
          example: PENDING
          description: 생성 시 PENDING
        createdAt:
          type: string
          format: date-time
          example: '2026-07-20T12:00:00.000Z'

paths:
  /api/reports:
    post:
      tags: [Report]
      summary: 신고 등록
      description: |
        로그인한 사용자가 신고를 생성합니다.
        - status는 생성 시 PENDING
        - adminId는 생성 시 null
        - reporterId는 인증 토큰의 사용자
        - 동일 reporter + target + targetId 중복 신고 불가
        - 자기 자신(USER) 또는 본인 콘텐츠(REVIEW/ARTICLE/COMMENT/MESSAGE) 신고 불가
        - CHAT_ROOM은 단일 소유자가 없어 자기 신고 검사를 하지 않음
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReportCreateRequest'
            examples:
              review:
                summary: 리뷰 신고
                value:
                  target: REVIEW
                  targetId: '42'
                  category: ABUSIVE_LANGUAGE
              user:
                summary: 유저 신고
                value:
                  target: USER
                  targetId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  category: INAPPROPRIATE_PROFILE
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/UserReportDetail'
              example:
                data:
                  id: 1
                  reporterId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  target: REVIEW
                  targetId: '42'
                  category: ABUSIVE_LANGUAGE
                  status: PENDING
                  createdAt: '2026-07-20T12:00:00.000Z'
        '400':
          description: 요청 본문 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REQUEST_BODY
                  message: 요청 본문 형식이 올바르지 않습니다.
        '401':
          description: 인증되지 않은 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요한 기능입니다.
        '403':
          description: 자기 자신 또는 본인 콘텐츠 신고
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REPORT_SELF_NOT_ALLOWED
                  message: 자기 자신 또는 본인 콘텐츠는 신고할 수 없습니다.
        '404':
          description: 신고 대상 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REPORT_TARGET_NOT_FOUND
                  message: 신고 대상을 찾을 수 없습니다.
        '409':
          description: 이미 신고한 대상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REPORT_ALREADY_EXISTS
                  message: 이미 신고한 대상입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
