paths:
  /api/admin/completed/statistics:
    get:
      tags: [Admin Completed Estimate Requests]
      summary: 관리자 완료 견적 요청 통계 조회
      description: |
        기간 조건에 따른 완료 견적 요청 및 확정 견적 금액 통계를 조회합니다.
        완료 견적 요청은 COMPLETED 상태이며, 실제 이사일(moveDate)을 기준으로 집계합니다.
        완료된 견적 금액은 CONFIRMED 상태 견적 중 실제 이사일(moveDate)이 기간에 포함된 항목을 기준으로 집계합니다.
        startDate가 없으면 전체 기간을 집계하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일(KST 00:00:00 ~ 다음 날 KST 00:00:00 직전)을 집계하고,
        endDate도 입력하면 두 날짜 사이를 집계합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일 (KST 기준)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 조회 종료일 (KST 기준, startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
      responses:
        '200':
          description: 완료 견적 요청 통계 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - totalCompletedCount
                      - averageCompletedPrice
                      - totalCompletedPrice
                    properties:
                      totalCompletedCount:
                        type: integer
                        description: COMPLETED 상태 견적 요청 수
                        example: 30
                      averageCompletedPrice:
                        type: object
                        required: [_avg]
                        description: CONFIRMED 상태 견적의 평균 금액 집계 결과
                        properties:
                          _avg:
                            type: object
                            required: [price]
                            properties:
                              price:
                                type: integer
                                nullable: true
                                description: 완료된 견적 평균 금액
                                example: 250000
                      totalCompletedPrice:
                        type: object
                        required: [_sum]
                        description: CONFIRMED 상태 견적의 총 금액 집계 결과
                        properties:
                          _sum:
                            type: object
                            required: [price]
                            properties:
                              price:
                                type: integer
                                nullable: true
                                description: 총 완료 견적 금액
                                example: 7500000
              example:
                data:
                  totalCompletedCount: 30
                  averageCompletedPrice:
                    _avg:
                      price: 250000
                  totalCompletedPrice:
                    _sum:
                      price: 7500000
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/completed:
    get:
      tags: [Admin Completed Estimate Requests]
      summary: 관리자 완료 견적 요청 목록 조회
      description: |
        COMPLETED 상태의 견적 요청을 이사일 최신순(moveDate desc, id desc)으로 조회합니다.
        search는 견적 요청 ID(정수), 요청자 이름 또는 전화번호를 대상으로 검색합니다.
        moveType은 하나의 이사 유형만 선택할 수 있습니다.
        startDate가 없으면 전체 기간을 조회하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일의 이사 완료 요청을 조회하고, endDate도 입력하면 두 날짜 사이의 이사일을 기준으로 조회합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: moveType
          in: query
          required: false
          description: 이사 유형 필터
          schema:
            type: string
            enum: [SMALL, HOME, OFFICE]
            example: HOME
        - name: search
          in: query
          required: false
          description: 견적 요청 ID, 요청자 이름 또는 전화번호 검색어
          schema:
            type: string
            minLength: 1
            example: 홍길동
        - name: startDate
          in: query
          required: false
          description: 이사일 조회 시작일 (미입력 시 전체 기간)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 이사일 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
        - name: page
          in: query
          required: false
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: 페이지당 조회 개수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
      responses:
        '200':
          description: 완료 견적 요청 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - userName
                        - phoneNumber
                        - moveType
                        - departureAddress
                        - arrivalAddress
                        - moveDate
                        - mover
                        - price
                      properties:
                        id:
                          type: integer
                          example: 123
                        userName:
                          type: string
                          example: 홍길동
                        phoneNumber:
                          type: string
                          nullable: true
                          example: '010-1234-5678'
                        moveType:
                          type: string
                          enum: [SMALL, HOME, OFFICE]
                          example: HOME
                        departureAddress:
                          type: string
                          example: 서울특별시 강남구 테헤란로 123
                        arrivalAddress:
                          type: string
                          example: 서울특별시 송파구 올림픽로 456
                        moveDate:
                          type: string
                          format: date-time
                          example: '2026-07-15T00:00:00.000Z'
                        mover:
                          type: string
                          description: 확정 견적의 이사 기사명
                          example: 빠른이사
                        price:
                          type: integer
                          description: 확정 견적 금액
                          example: 250000
                  meta:
                    type: object
                    required: [page, pageSize, totalCount, totalPages]
                    properties:
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10
                      totalCount:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 5
              example:
                data:
                  - id: 123
                    userName: 홍길동
                    phoneNumber: '010-1234-5678'
                    moveType: HOME
                    departureAddress: 서울특별시 강남구 테헤란로 123
                    arrivalAddress: 서울특별시 송파구 올림픽로 456
                    moveDate: '2026-07-15T00:00:00.000Z'
                    mover: 빠른이사
                    price: 250000
                meta:
                  page: 1
                  pageSize: 10
                  totalCount: 42
                  totalPages: 5
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
