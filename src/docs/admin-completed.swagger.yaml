paths:
  /api/admin/completed/statistics:
    get:
      tags: [Admin Completed Estimate Requests]
      summary: 관리자 완료 견적 요청 통계 조회
      description: |
        기간 조건에 따른 완료 견적 요청 및 확정 견적 금액 통계를 조회합니다.
        완료 견적 요청은 COMPLETED 상태이며, 실제 이사일(moveDate)을 기준으로 집계합니다.
        완료된 견적 금액은 CONFIRMED 상태 견적 중 실제 이사일(moveDate)이 기간에 포함된 항목을 기준으로 집계합니다.
        startDate가 없으면 전체 기간을 집계하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일(KST 00:00:00 ~ 다음 날 KST 00:00:00 직전)을 집계하고,
        endDate도 입력하면 두 날짜 사이를 집계합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일 (KST 기준)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 조회 종료일 (KST 기준, startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
      responses:
        '200':
          description: 완료 견적 요청 통계 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - totalCompletedCount
                      - averageCompletedPrice
                      - totalCompletedPrice
                    properties:
                      totalCompletedCount:
                        type: integer
                        description: COMPLETED 상태 견적 요청 수
                        example: 30
                      averageCompletedPrice:
                        type: integer
                        description: |
                          CONFIRMED 상태 견적의 평균 금액.
                          소수점은 반올림한 정수로 반환하며, 대상이 없으면 0이다.
                        example: 250000
                      totalCompletedPrice:
                        type: integer
                        description: CONFIRMED 상태 견적의 총 금액. 대상이 없으면 0
                        example: 7500000
              example:
                data:
                  totalCompletedCount: 30
                  averageCompletedPrice: 250000
                  totalCompletedPrice: 7500000
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/completed:
    get:
      tags: [Admin Completed Estimate Requests]
      summary: 관리자 완료 견적 요청 목록 조회
      description: |
        COMPLETED 상태의 견적 요청을 조회합니다.
        sort로 이사일 오름차순(ASC) 또는 최신순(DESC, 기본값)을 선택할 수 있으며,
        동일 이사일은 id desc로 보조 정렬합니다.
        id는 견적 요청 ID 정확 일치, userName은 요청자 이름 부분 일치,
        phoneNumber는 숫자만 추출해 전화번호 부분 일치로 필터합니다.
        여러 조건을 함께 보내면 AND로 적용됩니다.
        moveType은 하나의 이사 유형만 선택할 수 있습니다.
        startDate가 없으면 전체 기간을 조회하며, 이 경우 endDate는 적용되지 않습니다.
        startDate만 입력하면 해당 일의 이사 완료 요청을 조회하고, endDate도 입력하면 두 날짜 사이의 이사일을 기준으로 조회합니다.
        필수값이 누락된 불완전 데이터는 500 대신 해당 필드를 null로 내리고
        missingFields에 누락 필드명을 담아 반환합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: moveType
          in: query
          required: false
          description: 이사 유형 필터
          schema:
            type: string
            enum: [SMALL, HOME, OFFICE]
            example: HOME
        - name: id
          in: query
          required: false
          description: 견적 요청 ID (1 이상, Prisma Int 상한 이하)
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            example: 26
        - name: userName
          in: query
          required: false
          description: 요청자 이름 부분 검색 (앞뒤 공백 제거, 빈 문자열 불가)
          schema:
            type: string
            minLength: 1
            example: 홍길동
        - name: phoneNumber
          in: query
          required: false
          description: |
            요청자 전화번호 부분 검색.
            하이픈 등 비숫자는 무시하고, 숫자만 남겨 매칭합니다.
            숫자만 추출했을 때 길이가 1 이상이어야 합니다.
          schema:
            type: string
            minLength: 1
            example: '010-1234'
        - name: startDate
          in: query
          required: false
          description: 이사일 조회 시작일 (미입력 시 전체 기간)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 이사일 조회 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
        - name: sort
          in: query
          required: false
          description: |
            이사일 정렬 조건 (미입력 시 DESC).
            동일 이사일은 id desc로 보조 정렬합니다.
          schema:
            type: string
            enum: [ASC, DESC]
            example: DESC
        - name: page
          in: query
          required: false
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: 페이지당 조회 개수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
      responses:
        '200':
          description: 완료 견적 요청 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - userName
                        - phoneNumber
                        - moveType
                        - departureAddress
                        - arrivalAddress
                        - moveDate
                        - mover
                        - price
                        - missingFields
                      properties:
                        id:
                          type: integer
                          example: 123
                        userName:
                          type: string
                          example: 홍길동
                        phoneNumber:
                          type: string
                          nullable: true
                          example: '010-1234-5678'
                        moveType:
                          type: string
                          nullable: true
                          enum: [SMALL, HOME, OFFICE]
                          example: HOME
                        departureAddress:
                          type: string
                          nullable: true
                          example: 서울특별시 강남구 테헤란로 123
                        arrivalAddress:
                          type: string
                          nullable: true
                          example: 서울특별시 송파구 올림픽로 456
                        moveDate:
                          type: string
                          format: date-time
                          nullable: true
                          example: '2026-07-15T00:00:00.000Z'
                        mover:
                          type: string
                          nullable: true
                          description: 확정 견적의 이사 기사명. 없으면 null
                          example: 빠른이사
                        price:
                          type: integer
                          nullable: true
                          description: 확정 견적 금액. 없으면 null
                          example: 250000
                        missingFields:
                          type: array
                          description: |
                            상태 불변식상 있어야 하지만 null인 응답 필드명.
                            정상 데이터면 빈 배열
                          items:
                            type: string
                            enum:
                              [
                                moveType,
                                departureAddress,
                                arrivalAddress,
                                moveDate,
                                mover,
                                price,
                              ]
                          example: []
                  meta:
                    type: object
                    required: [page, pageSize, totalCount, totalPages]
                    properties:
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10
                      totalCount:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 5
              example:
                data:
                  - id: 123
                    userName: 홍길동
                    phoneNumber: '010-1234-5678'
                    moveType: HOME
                    departureAddress: 서울특별시 강남구 테헤란로 123
                    arrivalAddress: 서울특별시 송파구 올림픽로 456
                    moveDate: '2026-07-15T00:00:00.000Z'
                    mover: 빠른이사
                    price: 250000
                    missingFields: []
                meta:
                  page: 1
                  pageSize: 10
                  totalCount: 42
                  totalPages: 5
        '400':
          description: 쿼리 파라미터 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/completed/{estimateRequestId}:
    get:
      tags: [Admin Completed Estimate Requests]
      summary: 관리자 완료 견적 요청 상세 조회
      description: |
        견적 요청 ID로 COMPLETED 상태의 완료 건 상세 정보를 조회합니다.
        존재하지 않거나 COMPLETED가 아닌 상태면 404를 반환합니다.
        요청자 닉네임(userNickname)과 확정 견적의 기사 닉네임(confirmedQuote.moverNickname)을 함께 반환합니다.
        출발지·도착지 주소 상세(우편번호, 상세주소)와 확정 견적(confirmedQuote) 정보를 함께 반환합니다.
        필수값이 누락된 불완전 데이터는 500 대신 해당 필드를 null로 내리고
        missingFields에 누락 필드명을 담아 반환합니다. confirmedQuote 자체가 없으면 null입니다.
        목록과 동일한 moveType, id, userName, phoneNumber, startDate, endDate, sort 쿼리를 받으면
        그 목록 기준으로 이전(prevId)·다음(nextId) 완료 건 ID를 함께 반환합니다.
        쿼리를 생략하면 COMPLETED 전체·이사일 최신순 기준입니다.
        현재 건이 해당 필터에 없거나 맨 앞·맨 뒤이거나 moveDate가 없으면 해당 방향은 null입니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: estimateRequestId
          in: path
          required: true
          description: 조회할 완료 견적 요청 ID
          schema:
            type: integer
            minimum: 1
            example: 123
        - name: moveType
          in: query
          required: false
          description: 앞뒤 조회에 사용할 이사 유형 필터
          schema:
            type: string
            enum: [SMALL, HOME, OFFICE]
            example: HOME
        - name: id
          in: query
          required: false
          description: 앞뒤 조회에 사용할 견적 요청 ID 정확 일치
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            example: 26
        - name: userName
          in: query
          required: false
          description: 앞뒤 조회에 사용할 요청자 이름 부분 검색
          schema:
            type: string
            minLength: 1
            example: 홍길동
        - name: phoneNumber
          in: query
          required: false
          description: 앞뒤 조회에 사용할 요청자 전화번호 부분 검색
          schema:
            type: string
            minLength: 1
            example: '010-1234'
        - name: startDate
          in: query
          required: false
          description: 앞뒤 조회에 사용할 이사일 시작일 (미입력 시 전체 기간)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: endDate
          in: query
          required: false
          description: 앞뒤 조회에 사용할 이사일 종료일 (startDate 미입력 시 적용되지 않음)
          schema:
            type: string
            format: date
            example: '2026-07-30'
        - name: sort
          in: query
          required: false
          description: |
            앞뒤 조회에 사용할 이사일 정렬 (미입력 시 DESC).
            동일 이사일은 id desc로 보조 정렬합니다.
            prevId는 목록에서 위, nextId는 아래입니다.
          schema:
            type: string
            enum: [ASC, DESC]
            example: DESC
      responses:
        '200':
          description: 완료 견적 요청 상세 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - userName
                      - userNickname
                      - moveType
                      - departureAddress
                      - departureDetailAddress
                      - departureZipCode
                      - arrivalAddress
                      - arrivalDetailAddress
                      - arrivalZipCode
                      - moveDate
                      - confirmedQuote
                      - prevId
                      - nextId
                      - missingFields
                    properties:
                      id:
                        type: integer
                        example: 123
                      userName:
                        type: string
                        example: 홍길동
                      userNickname:
                        type: string
                        description: 요청자 닉네임
                        example: 길동이
                      moveType:
                        type: string
                        nullable: true
                        enum: [SMALL, HOME, OFFICE]
                        example: HOME
                      departureAddress:
                        type: string
                        nullable: true
                        example: 서울특별시 강남구 테헤란로 123
                      departureDetailAddress:
                        type: string
                        nullable: true
                        example: 101동 1001호
                      departureZipCode:
                        type: string
                        nullable: true
                        example: '06236'
                      arrivalAddress:
                        type: string
                        nullable: true
                        example: 서울특별시 송파구 올림픽로 456
                      arrivalDetailAddress:
                        type: string
                        nullable: true
                        example: A동 502호
                      arrivalZipCode:
                        type: string
                        nullable: true
                        example: '05551'
                      moveDate:
                        type: string
                        format: date-time
                        nullable: true
                        description: 실제 이사일
                        example: '2026-07-15T00:00:00.000Z'
                      confirmedQuote:
                        type: object
                        nullable: true
                        required: [moverName, moverNickname, price, comment, createdAt]
                        description: 확정 견적 정보. 없으면 null
                        properties:
                          moverName:
                            type: string
                            nullable: true
                            example: 빠른이사
                          moverNickname:
                            type: string
                            nullable: true
                            description: 확정 견적 기사 닉네임. 기사 정보가 없으면 null
                            example: 빠른이사맨
                          price:
                            type: integer
                            nullable: true
                            description: 확정 견적 금액
                            example: 250000
                          comment:
                            type: string
                            nullable: true
                            description: 견적 코멘트
                            example: 안전하게 모시겠습니다.
                          createdAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: 견적 생성 일시
                            example: '2026-07-10T11:00:00.000Z'
                      prevId:
                        type: integer
                        nullable: true
                        description: |
                          전달한 목록 필터·정렬 기준 이전 완료 건 ID.
                          맨 앞이거나 현재 건이 필터에 없으면 null
                        example: 122
                      nextId:
                        type: integer
                        nullable: true
                        description: |
                          전달한 목록 필터·정렬 기준 다음 완료 건 ID.
                          맨 뒤이거나 현재 건이 필터에 없으면 null
                        example: 124
                      missingFields:
                        type: array
                        description: |
                          상태 불변식상 있어야 하지만 null인 응답 필드명.
                          confirmedQuote 하위 누락은 confirmedQuote.moverName, confirmedQuote.moverNickname 형태로 표시.
                          정상 데이터면 빈 배열
                        items:
                          type: string
                        example: []
              example:
                data:
                  id: 123
                  userName: 홍길동
                  userNickname: 길동이
                  moveType: HOME
                  departureAddress: 서울특별시 강남구 테헤란로 123
                  departureDetailAddress: 101동 1001호
                  departureZipCode: '06236'
                  arrivalAddress: 서울특별시 송파구 올림픽로 456
                  arrivalDetailAddress: A동 502호
                  arrivalZipCode: '05551'
                  moveDate: '2026-07-15T00:00:00.000Z'
                  confirmedQuote:
                    moverName: 빠른이사
                    moverNickname: 빠른이사맨
                    price: 250000
                    comment: 안전하게 모시겠습니다.
                    createdAt: '2026-07-10T11:00:00.000Z'
                  prevId: 122
                  nextId: 124
                  missingFields: []
        '400':
          description: Path Parameter 또는 Query Parameter 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '404':
          description: 견적 요청이 없거나 COMPLETED 상태가 아닌 경우
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_ESTIMATE_REQUEST_NOT_FOUND
                  message: 존재하지 않는 견적 요청입니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
