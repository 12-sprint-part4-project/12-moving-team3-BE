paths:
  /api/designated-estimate-requests/{estimateRequestId}/movers/{moverId}:
    get:
      tags: [DesignatedEstimateRequest]
      summary: 지정 견적 존재 여부 조회
      description: |
        고객 본인의 견적요청에 대해 특정 기사님이 지정되어 있는지 조회합니다.
        지정 행이 없으면 404가 아니라 exists=false 로 200을 반환합니다.
        존재하지 않거나 본인 소유가 아닌 견적요청은 404/403을 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: estimateRequestId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 견적요청 ID (EstimateRequest.id)
        - name: moverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 기사님 User.id (UUID)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [exists, designatedMover]
                    properties:
                      exists:
                        type: boolean
                      designatedMover:
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/DesignatedEstimateMover'
              examples:
                notExists:
                  summary: 지정 없음
                  value:
                    data:
                      exists: false
                      designatedMover: null
                exists:
                  summary: 지정 있음
                  value:
                    data:
                      exists: true
                      designatedMover:
                        id: 12
                        estimateId: 34
                        moverId: 11111111-1111-1111-1111-111111111111
        '400':
          description: 유효하지 않은 path params (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인 견적요청이 아님 (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            - ESTIMATE_REQUEST_NOT_FOUND: 견적요청 없음
            - PROFILE_NOT_FOUND: 고객 프로필 미등록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DesignatedEstimateMover:
      type: object
      required: [id, estimateId, moverId]
      properties:
        id:
          type: integer
          description: EstimateDesignatedMover.id
        estimateId:
          type: integer
          description: EstimateRequest.id
        moverId:
          type: string
          format: uuid
          description: 지정된 기사님 User.id
