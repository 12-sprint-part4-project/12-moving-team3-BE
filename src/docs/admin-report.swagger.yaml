              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '404':
          description: 신고가 존재하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
