  /api/admin/reports/{reportId}/resolve:
    post:
      tags: [Admin Reports]
      summary: 관리자 신고 처리
      description: |
        PENDING 신고에 대해 선택한 Action을 실행하고 RESOLVED로 변경합니다.
        adminId는 Access Token의 인증 정보에서만 사용하며 요청 본문으로 받지 않습니다.
        지원하지 않는 신고 대상이거나 대상에 허용되지 않는 Action은 거절됩니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          description: 신고 ID (양의 정수)
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - SUSPEND_TARGET_USER
                      - DELETE_REPORTED_CONTENT
                  example:
                    - SUSPEND_TARGET_USER
                    - DELETE_REPORTED_CONTENT
      responses:
        '200':
          description: 신고 처리 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - reportId
                      - status
                      - adminId
                      - actions
                      - processedAt
                      - contentAlreadyDeleted
                    properties:
                      reportId:
                        type: integer
                        example: 1
                      status:
                        type: string
                        enum: [RESOLVED]
                        example: RESOLVED
                      adminId:
                        type: integer
                        example: 1
                      actions:
                        type: array
                        items:
                          type: string
                          enum:
                            - SUSPEND_TARGET_USER
                            - DELETE_REPORTED_CONTENT
                      processedAt:
                        type: string
                        format: date-time
                      contentAlreadyDeleted:
                        type: boolean
                        nullable: true
                        description: DELETE Action이 있을 때만 채움. 이미 삭제된 콘텐츠면 true
              example:
                data:
                  reportId: 1
                  status: RESOLVED
                  adminId: 1
                  actions:
                    - SUSPEND_TARGET_USER
                    - DELETE_REPORTED_CONTENT
                  processedAt: '2026-08-07T10:00:00.000Z'
                  contentAlreadyDeleted: false
        '400':
          description: |
            Path/Body 검증 실패, 허용되지 않는 Action, 또는 지원하지 않는 신고 대상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParamOrBody:
                  value:
                    error:
                      code: ADMIN_INVALID_QUERY_PARAM
                      message: 조회 조건이 올바르지 않습니다.
                invalidActions:
                  value:
                    error:
                      code: ADMIN_REPORT_INVALID_ACTIONS
                      message: 신고 대상에 허용되지 않는 처리 액션입니다.
                unsupportedTarget:
                  value:
                    error:
                      code: ADMIN_REPORT_UNSUPPORTED_TARGET
                      message: 처리할 수 없는 신고 대상입니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '404':
          description: 신고·대상 사용자·콘텐츠 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reportNotFound:
                  value:
                    error:
                      code: ADMIN_REPORT_NOT_FOUND
                      message: 존재하지 않는 신고입니다.
                targetUserNotFound:
                  value:
                    error:
                      code: ADMIN_REPORT_TARGET_USER_NOT_FOUND
                      message: 신고 대상 사용자를 찾을 수 없습니다.
                contentNotFound:
                  value:
                    error:
                      code: ADMIN_REPORT_CONTENT_NOT_FOUND
                      message: 신고된 콘텐츠를 찾을 수 없습니다.
        '409':
          description: 이미 처리·반려된 신고 또는 동시 처리 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyProcessed:
                  value:
                    error:
                      code: ADMIN_REPORT_ALREADY_PROCESSED
                      message: 이미 처리되었거나 반려된 신고입니다.
                conflict:
                  value:
                    error:
                      code: ADMIN_REPORT_CONFLICT
                      message: 다른 관리자가 동시에 처리 중이거나 상태가 변경되었습니다.
        '500':
          description: 저장된 targetId 이상 등 서버 데이터 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.

  /api/admin/reports/{reportId}/reject:
    post:
      tags: [Admin Reports]
      summary: 관리자 신고 반려
      description: |
        PENDING 신고를 REJECTED로 변경합니다. 요청 body와 Action은 없습니다.
        사용자 정지·콘텐츠 삭제는 수행하지 않으며, 대상 누락 신고도 반려할 수 있습니다.
        adminId는 Access Token의 인증 정보에서만 사용합니다.
        관리자 Access Token(Bearer) 인증이 필요합니다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          description: 신고 ID (양의 정수)
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: 신고 반려 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - reportId
                      - status
                      - adminId
                      - processedAt
                    properties:
                      reportId:
                        type: integer
                        example: 1
                      status:
                        type: string
                        enum: [REJECTED]
                        example: REJECTED
                      adminId:
                        type: integer
                        example: 1
                      processedAt:
                        type: string
                        format: date-time
              example:
                data:
                  reportId: 1
                  status: REJECTED
                  adminId: 1
                  processedAt: '2026-08-07T10:00:00.000Z'
        '400':
          description: Path Parameter(reportId) 형식 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_INVALID_QUERY_PARAM
                  message: 조회 조건이 올바르지 않습니다.
        '401':
          description: 관리자 Access Token이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_UNAUTHORIZED
                  message: 관리자 인증이 필요합니다.
        '404':
          description: 신고가 존재하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ADMIN_REPORT_NOT_FOUND
                  message: 존재하지 않는 신고입니다.
        '409':
          description: 이미 처리·반려된 신고 또는 동시 처리 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyProcessed:
                  value:
                    error:
                      code: ADMIN_REPORT_ALREADY_PROCESSED
                      message: 이미 처리되었거나 반려된 신고입니다.
                conflict:
                  value:
                    error:
                      code: ADMIN_REPORT_CONFLICT
                      message: 다른 관리자가 동시에 처리 중이거나 상태가 변경되었습니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 내부 오류가 발생했습니다.
