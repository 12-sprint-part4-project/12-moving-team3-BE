                conflict:
                  value:
                    error:
                      code: ADMIN_REPORT_CONFLICT
                      message: 다른 관리자가 동시에 처리 중이거나 상태가 변경되었습니다.
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
