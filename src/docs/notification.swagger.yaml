paths:
  /api/notifications/customer:
    get:
      tags: [Notifications]
      summary: 일반 유저 알림 목록 조회
      description: |
        로그인한 고객의 최신 알림을 최대 10개까지 반환합니다.
        드롭다운용이며, 전체 모아보기(페이지네이션)는 심화 범위에서 제외합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
              example:
                data:
                  notifications:
                    - id: 1
                      type: NEW_QUOTE_OFFER_ARRIVED
                      content: 김코드 기사님의 소형이사 견적이 도착했어요
                      payload:
                        moverName: 김코드
                        moveTypeLabel: 소형이사
                      isRead: false
                      createdAt: '2026-07-20T13:15:00.000Z'
                      quoteId: 10
                      estimateRequestId: null
                  totalCount: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications/mover:
    get:
      tags: [Notifications]
      summary: 기사님 알림 목록 조회
      description: |
        로그인한 기사님의 최신 알림을 최대 10개까지 반환합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
              example:
                data:
                  notifications:
                    - id: 2
                      type: NEW_DESIGNATED_QUOTE_REQUEST_ARRIVED
                      content: 박소정 고객님의 소형이사 지정 견적 요청이 도착했어요
                      payload:
                        customerName: 박소정
                        moveTypeLabel: 소형이사
                      isRead: false
                      createdAt: '2026-07-20T13:15:00.000Z'
                      quoteId: null
                      estimateRequestId: 5
                  totalCount: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications/stream:
    get:
      tags: [Notifications]
      summary: 알림 SSE 스트림
      description: |
        Server-Sent Events로 실시간 알림을 수신합니다.
        EventSource는 Authorization 헤더를 보낼 수 없어 `accessToken` 쿼리로 JWT를 전달합니다.
        이벤트: `notification`, `unread-count` / 주석 하트비트(약 20초).
      parameters:
        - name: accessToken
          in: query
          required: true
          description: Access Token (JWT)
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream 연결
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: notification
                  data: {"id":1,"type":"NEW_QUOTE_OFFER_ARRIVED","content":"..."}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{notificationId}:
    patch:
      tags: [Notifications]
      summary: 알림 단건 읽음 처리
      description: 본인 알림만 읽음 처리할 수 있습니다. 처리 후 SSE로 unread-count를 푸시합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 알림 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOTIFICATION_NOT_FOUND
                  message: 존재하지 않는 알림입니다.

components:
  schemas:
    NotificationItem:
      type: object
      required:
        - id
        - type
        - content
        - payload
        - isRead
        - createdAt
        - quoteId
        - estimateRequestId
      properties:
        id:
          type: integer
          example: 1
        type:
          type: string
          enum:
            - NEW_QUOTE_REQUEST_ARRIVED
            - NEW_DESIGNATED_QUOTE_REQUEST_ARRIVED
            - NEW_QUOTE_OFFER_ARRIVED
            - NEW_DESIGNATED_QUOTE_OFFER_ARRIVED
            - QUOTE_CONFIRMED
            - DESIGNATED_QUOTE_REJECTED
            - CUSTOMER_MOVE_DAY_REMINDER
            - MOVER_MOVE_DAY_REMINDER
            - REVIEW_REQUESTED
            - REVIEW_WRITTEN
            - COMMUNITY_COMMENT
            - SANCTION_NOTIFIED
        content:
          type: string
          example: 김코드 기사님의 소형이사 견적이 도착했어요
        payload:
          type: object
          additionalProperties:
            type: string
          example:
            moverName: 김코드
            moveTypeLabel: 소형이사
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        quoteId:
          type: integer
          nullable: true
        estimateRequestId:
          type: integer
          nullable: true
    NotificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [notifications, totalCount]
          properties:
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/NotificationItem'
            totalCount:
              type: integer
              example: 7
